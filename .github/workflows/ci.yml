# Continuous integration. PRD section 18.1, TRD section 14.1.
#
# `verify` and `build` are wired now. The a11y, perf, links and no-JS jobs are
# scaffolded but commented out until the tooling is added, because a workflow
# that references a script which does not exist is worse than one that is
# honest about its coverage.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The evidence policy gate (PRD section 9.2). A metric without a basis,
      # a case study with no `whatDidNotWork`, or a denylisted client name
      # fails the build here.
      - name: Validate content
        run: npm run validate:content

      # Non-blocking on purpose while content is still being written: this
      # reports the outstanding TODO(Q*) markers so the release checklist has a
      # live count, without blocking unrelated work. It becomes blocking at
      # launch (TRD section 15.3).
      - name: Validate content (strict, informational)
        run: npm run validate:strict
        continue-on-error: true

  build:
    name: Build and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # NFR-10: build in under 90 seconds. The step fails if it stalls well
      # past that rather than hanging for the runner's full six hours.
      - name: Build
        run: npm run build
        timeout-minutes: 5

      - name: Report client bundle size
        run: |
          echo "### Client JS on / (gzipped)" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          total=0
          for f in $(grep -o '/_next/static/chunks/[^"]*\.js' out/index.html | sort -u); do
            p="out${f}"
            [ -f "$p" ] || continue
            # Polyfills are loaded `noModule`, so the NFR-8 browser matrix
            # never fetches them. Counting them would overstate the payload.
            case "$f" in *polyfills*) continue;; esac
            sz=$(gzip -c "$p" | wc -c)
            echo "- \`$(basename "$f")\` — $((sz / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
            total=$((total + sz))
          done
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "**Total: $((total / 1024)) KB** (budget: 110 KB, see ADR-010)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt 112640 ]; then
            echo "Client JS budget exceeded: $((total / 1024)) KB > 110 KB." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FR-P5. Blocking on high and critical advisories.
      - run: npm audit --audit-level=high

# TODO(phase 4): the remaining PRD section 18.1 gates, once their tooling lands.
#
#   a11y   axe-core over every route in `out/`     — blocking on any violation
#   perf   Lighthouse CI, mobile preset            — blocking below 95
#   links  internal + external + flagship liveUrl  — blocking internal/flagship
#   nojs   Playwright with javaScriptEnabled:false — blocking (NFR-9)
#
# Specified in TRD sections 14.1 and 15.2.
