# Deploy to GitHub Pages. TRD section 14.2.
#
# REQUIRED ONE-TIME SETUP, or this workflow runs green and nothing appears:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
# (not "Deploy from a branch"). This is the single most common cause of a
# silent non-deploy.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancelling a half-finished Pages deployment can leave the environment
# inconsistent, and the cost of letting a superseded run finish is seconds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required: build-meta reads per-file git dates for the footer and
          # sitemap lastmod. A shallow clone silently produces wrong dates.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild runs content validation and build metadata. A content rule
      # breach fails here, before anything is published.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
